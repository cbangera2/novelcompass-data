name: Fix stale covers

# Manual only for now. Add a `schedule:` trigger once a manual run from GitHub's runners looks healthy.
on:
  workflow_dispatch:
    inputs:
      search_minutes:
        description: Stop searching for replacements after this many minutes
        default: "20"
      recheck_days:
        description: Days before an unresolved cover is searched again
        default: "90"

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find and fix broken covers
        run: python scripts/fix_broken_covers.py --search-minutes "${{ inputs.search_minutes }}" --recheck-days "${{ inputs.recheck_days }}"
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat cover-fix-summary.md >> "$GITHUB_STEP_SUMMARY"
          git diff --quiet -- catalog.json bootstrap-catalog.json manifest.json cover-known-bad.json && { echo "No changes."; exit 0; }
          branch=bot/cover-fixes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add catalog.json bootstrap-catalog.json manifest.json cover-known-bad.json
          git commit -m "fix stale NU covers (automated)"
          git push --force origin "$branch"
          body="$(cat cover-fix-summary.md)

          Only the \`cover\` column changes. Generated by \`scripts/fix_broken_covers.py\`."
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "fix stale NU covers (automated)" --body "$body"
          fi
